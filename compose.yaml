x-api-image: &api-build
  context: .
  dockerfile: server/Dockerfile

services:
  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build: *api-build
    image: schimmelpilz-api
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      LEGAL_DATA_DIR: /data/legal-sources
      COOKIE_SECURE: "true"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PERSONAL: ${STRIPE_PRICE_PERSONAL:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      STRIPE_PRICE_FIRM: ${STRIPE_PRICE_FIRM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-true}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - app_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      # The office functions must start even if the AI model is down; research reports it as unavailable.
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:0.35.1
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # One-off: downloads the chat model into the ollama_models volume (skipped when already present).
  ollama-model:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:7b}"]
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

  # Daily encrypted backup with verification. Copy /backups and the key volume off this server.
  backup:
    image: schimmelpilz-api
    restart: unless-stopped
    command: ["python", "-m", "server.backup_scheduler"]
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      BACKUP_KEY_FILE: /backup-keys/master.key
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-0}
    volumes:
      - app_data:/data
      - ${BACKUP_PATH:-./backups/docker}:/backups
      - backup_keys:/backup-keys
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      landing:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  app_data:
  caddy_data:
  caddy_config:
  ollama_models:
  backup_keys:
